<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'" />
    <title>Connect to Bard</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        height: 100vh; display: grid; place-items: center; padding: 24px;
        background: #070a08; color: #f1f4f2;
        font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; font-size: 14px;
      }
      .card { width: 100%; max-width: 380px; }
      h1 { font-size: 19px; font-weight: 700; letter-spacing: -0.3px; }
      p { color: #9aa39d; font-size: 13px; margin: 8px 0 22px; line-height: 1.5; }
      label { display: block; font-size: 12px; font-weight: 600; color: #9aa39d; margin-bottom: 6px; }
      input {
        width: 100%; padding: 11px 12px; font: inherit; color: inherit;
        background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
        border-radius: 8px; outline: none;
      }
      input:focus { border-color: #1db954; }
      button {
        width: 100%; margin-top: 16px; padding: 12px; font: inherit; font-weight: 700;
        color: #000; background: #1db954; border: none; border-radius: 999px; cursor: pointer;
      }
      button:hover { background: #1ed760; }
      .err { min-height: 18px; margin-top: 12px; font-size: 12.5px; color: #e0665c; text-align: center; }
      .hint { font-size: 11.5px; color: #677069; margin-top: 4px; }
    </style>
  </head>
  <body>
    <form class="card" id="f">
      <h1>Connect to Bard</h1>
      <p>Where is the bot's web player running? You will sign in on the next screen.</p>
      <label for="u">Server address</label>
      <input id="u" placeholder="192.168.1.158:5000" autocomplete="off" spellcheck="false" />
      <div class="hint">http:// is assumed if you leave the scheme off.</div>
      <button type="submit">Connect</button>
      <div class="err" id="e"></div>
    </form>
    <script>
      const input = document.getElementById('u');
      const err = document.getElementById('e');
      window.bardSetup.current().then((v) => { if (v) input.value = v; });
      input.focus();
      document.getElementById('f').addEventListener('submit', async (event) => {
        event.preventDefault();
        err.textContent = '';
        const result = await window.bardSetup.save(input.value);
        if (!result.ok) err.textContent = result.message || 'Could not use that address.';
      });
    </script>
  </body>
</html>
